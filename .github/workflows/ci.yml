name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Linux runners are plentiful (macOS ones queue for long); the image has the Chrome and Node the browser tests use.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --frozen --group dev --python 3.12
      - name: Lint
        run: uv run --frozen ruff check src tests scripts
      - name: Test
        run: uv run --frozen pytest -q
