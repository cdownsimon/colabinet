licence = "Apache-2.0"
parallel = 1

[preset.gpu.L4]
ctx = 262144
kv = "q4_0"
mmproj_gpu = false

[preset.gpu.A100]
ctx = 262144
kv = "q8_0"
mmproj_gpu = true

[preset.gpu.A100-80]
ctx = 262144
