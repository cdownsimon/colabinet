engine = "llamacpp"
label = "Qwen3.8-27B UD-Q4_K_M (+vision)"
repo = "unsloth/Qwen3.8-27B-GGUF"
file = "Qwen3.8-27B-UD-Q4_K_M.gguf"
mmproj = "mmproj-BF16.gguf"
template = "qwen38_effort_map.jinja"
alias = "qwen/qwen3.8-27b"
weights_gb = 16.5
