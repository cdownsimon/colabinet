[preset.gpu.A100]
ctx = 262144
kv = "FP16"

[preset.gpu.G4]
ctx = 262144
kv = "FP16"

# Flash-Next is 180B total, not a 27B-sized model. The four Q4 shards total 111.33 GB.
# A100 40GB requires CPU offload and sufficient host RAM; fit remains advisory.
# Start with 8K context. KV size is deliberately unknown for this hybrid architecture.

[preset.measured]  # one pass at the preset's defaults; docs/benchmarks/2026-10-13-qwen38-preset-matrix.md
L4 = { gen_tps = 16.3, prefill_tps = 525, date = "2026-10-13", note = "prefill includes the VM's first ExLlamaV3 kernel warm-up" }
A100 = { gen_tps = 47.5, prefill_tps = 795, date = "2026-10-13", note = "prefill includes the VM's first ExLlamaV3 kernel warm-up" }
A100-80 = { gen_tps = 46.5, prefill_tps = 727, date = "2026-10-13", note = "prefill includes the VM's first ExLlamaV3 kernel warm-up" }
G4 = { gen_tps = 65.3, prefill_tps = 2346, date = "2026-10-13", note = "prefill includes the VM's first ExLlamaV3 kernel warm-up" }

[[preset]]
id = "qwen38-flash-next-abl-q4k-xl"
engine = "llamacpp"
label = "Qwen3.8-Flash-Next abliterated UD-Q4_K_XL (+vision, CPU offload)"
repo = "huihui-ai/Huihui-Qwen3.8-Flash-Next-abliterated-GGUF"
file = "unsloth-UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf"  # folder renamed upstream
mmproj = "mmproj-model-bf16.gguf"
template = "qwen38_effort_map.jinja"
alias = "huihui.ai/qwen3.8-flash-next-abliterated"
weights_gb = 111.334655392
licence = "Qwen Community License 1.0 (Hugging Face metadata)"
parallel = 1

[preset.gpu.A100]
ctx = 8192
kv = "f16"

[preset.gpu.A100-80]
ctx = 8192
kv = "f16"

[preset.gpu.G4]
ctx = 8192
kv = "f16"

# Strata caches experts in VRAM and keeps the expert arena in host RAM.
# weights_gb counts both GGUF shards, NOT required VRAM. The 28.8 GB PLE table is shared.
# Vision is required for these presets; refusal projection remains opt-in.

[preset.measured]  # one pass at the preset's defaults; docs/benchmarks/2026-10-13-qwen38-preset-matrix.md
T4 = { gen_tps = 0.24, date = "2026-10-13", note = "weights page from disk" }
T4-HIGHMEM = { gen_tps = 1.8, prefill_tps = 9, date = "2026-10-13", note = "weights page from disk" }
L4 = { gen_tps = 3.0, prefill_tps = 11, date = "2026-10-13", note = "weights page from disk" }
A100 = { gen_tps = 8.0, prefill_tps = 90, date = "2026-10-13", note = "CPU offload, first request; warmed 2026-10-03 runs measured 19.7 tok/s" }
A100-80 = { gen_tps = 38.7, prefill_tps = 886, date = "2026-10-13" }
G4 = { gen_tps = 50.8, prefill_tps = 1366, date = "2026-10-13" }

