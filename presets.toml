G4 = { gen_tps = 71.2, prefill_tps = 3652, date = "2026-10-13" }

[[preset]]
id = "qwen38-27b-abl-exl3-4bpw"
engine = "exllamav3"
label = "Qwen3.8-27B abliterated EXL3 4.0 bpw (+vision)"
repo = "turboderp/Huihui-Qwen3.8-27B-abliterated-exl3"
revision = "4.00bpw"
template = "qwen38_effort_map.jinja"
alias = "huihui.ai/qwen3.8-27b-abliterated"
vision = true
vision_offload = true  # Keep vision weights in system RAM; stream them to the GPU for image encoding.
weights_gb = 13.2  # Estimated text weights on GPU; vision weights are offloaded by default.
kv_bytes_per_token_f16 = 65536
licence = "Apache-2.0 (Hugging Face metadata)"
parallel = 1

[preset.gpu.L4]
ctx = 65536
kv = "FP16"

[preset.gpu.A100]
ctx = 262144
kv = "FP16"

[preset.gpu.G4]
ctx = 262144
kv = "FP16"

# The original (not abliterated) model from the same quantizer and bitrate. Its layers and lm_head are the same
# 13.2 GB as the abliterated build (embeddings stay in system RAM); only the offloaded vision tower is larger.

[preset.measured]  # one pass at the preset's defaults; docs/benchmarks/2026-10-13-qwen38-preset-matrix.md
L4 = { gen_tps = 16.2, prefill_tps = 736, date = "2026-10-13" }
A100 = { gen_tps = 46.9, prefill_tps = 2639, date = "2026-10-13" }
A100-80 = { gen_tps = 48.9, prefill_tps = 2673, date = "2026-10-13" }
G4 = { gen_tps = 67.8, prefill_tps = 4854, date = "2026-10-13" }

[[preset]]
id = "qwen38-27b-exl3-4bpw"
engine = "exllamav3"
label = "Qwen3.8-27B EXL3 4.0 bpw (+vision)"
repo = "turboderp/Qwen3.8-27B-exl3"
revision = "4.00bpw"
template = "qwen38_effort_map.jinja"
