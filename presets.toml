# colabinet model presets. Edit by hand; reload with `colabinet ctl presets` (plan 2 adds a UI button).
# Per-GPU defaults are keyed by rate class: CPU, T4, T4-HIGHMEM, L4, A100, A100-80, G4
# (A100-80 falls back to A100 and T4-HIGHMEM to T4 when missing).

[engines.llamacpp]
release = "b11273"  # prebuilt llama-<release>-bin-ubuntu-cuda-12.8-x64 (bundles its own cudart)

[engines.exllamav3]
wheel = "1.5.2"
tabbyapi_commit = "be74bf0a00bcb3a518e6feb7606f150c189be637"

[engines.strata]
release = "d6708a4aae15b4860000d54c8af9e84d684bce09"  # engine 0.1.29, measured on Colab L4 and A100 40GB

[[preset]]
id = "qwen38-27b-abl-q4k"
engine = "llamacpp"
label = "Qwen3.8-27B abliterated Q4_K (+vision)"
repo = "huihui-ai/Huihui-Qwen3.8-27B-abliterated-GGUF"
file = "Huihui-Qwen3.8-27B-abliterated-Q4_K.gguf"
mmproj = "mmproj-model-bf16.gguf"
template = "qwen38_effort_map.jinja"  # in src/colabinet/chat_templates/
alias = "huihui.ai/qwen3.8-27b-abliterated"
weights_gb = 16.8
kv_bytes_per_token_f16 = 65536
licence = "Apache-2.0"
parallel = 1

[preset.gpu.L4]
ctx = 262144
kv = "q4_0"
mmproj_gpu = false

[preset.gpu.A100]
ctx = 262144
kv = "q8_0"
mmproj_gpu = true

[preset.gpu.A100-80]
ctx = 262144
kv = "f16"
mmproj_gpu = true

[preset.gpu.G4]
ctx = 262144
kv = "f16"
mmproj_gpu = true

# The original (not abliterated) model. Unsloth's dynamic UD-Q4_K_M is the closest in size to the abliterated
# Q4_K above (16.46 vs 16.81 GB), so it keeps the same per-GPU defaults; the 18.97 GB ggml-org Q4_K_M would
# not fit L4 at 256K. The stock chat template matches Qwen/Qwen3.8-27B, so the effort-mapped one applies.

[preset.measured]  # one pass at the preset's defaults; docs/benchmarks/2026-10-13-qwen38-preset-matrix.md
T4 = { gen_tps = 1.0, prefill_tps = 140, date = "2026-10-13", note = "CPU offload" }
T4-HIGHMEM = { gen_tps = 3.0, prefill_tps = 167, date = "2026-10-13", note = "CPU offload" }
L4 = { gen_tps = 13.1, prefill_tps = 660, date = "2026-10-13" }
A100 = { gen_tps = 43.0, prefill_tps = 1194, date = "2026-10-13" }
A100-80 = { gen_tps = 45.2, prefill_tps = 1214, date = "2026-10-13" }
G4 = { gen_tps = 67.8, prefill_tps = 3527, date = "2026-10-13" }

