[preset.evidence.L4]
status = "tested"
message = """Saved IQ2_XS text and GPU-vision runs on L4 with about 52 GiB host RAM,
128K context limit and int8 KV. Image/OCR and 4K text passed at about 21.7 GiB total GPU use.
Long mmap prompts stalled; this is not full-context validation.
Source: Strata benchmark runs, 2026-09-30."""
performance = """GPU vision, direct PLE: 43.4 t/s median (2 req, 512 tokens out), 1,119–3,626 input tokens.
Text-only, direct PLE: 43.8 t/s median (5 req, 1,280 tokens out), 1,119–120,950 input tokens."""

[preset.evidence.A100]
status = "tested"
